<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="autumnSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="50%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#autumnSky)" />

  <!-- CÂY HỒNG MÙA THU SAI TRĨU QUẢ ĐỎ MỌNG (柿の木) -->
  <path d="M600,480 C580,380 620,260 560,180 C520,130 460,100 360,90" stroke="#451a03" stroke-width="26" stroke-linecap="round" fill="none" />
  <path d="M570,220 C620,170 700,140 760,130" stroke="#451a03" stroke-width="18" stroke-linecap="round" fill="none" />

  <!-- Lá hồng mùa thu đỏ vàng -->
  <g fill="#ea580c" opacity="0.8">
    <ellipse cx="480" cy="110" rx="30" ry="20" transform="rotate(15, 480, 110)" />
    <ellipse cx="550" cy="140" rx="35" ry="22" transform="rotate(-20, 550, 140)" />
    <ellipse cx="640" cy="120" rx="40" ry="25" transform="rotate(30, 640, 120)" />
    <ellipse cx="710" cy="140" rx="30" ry="18" transform="rotate(-15, 710, 140)" />
  </g>

  <!-- Những quả hồng chín đỏ mọng ngọt ngào (柿の実) -->
  <g filter="url(#softShadow)">
    <g transform="translate(460, 140)">
      <circle cx="0" cy="0" r="24" fill="#f97316" stroke="#c2410c" stroke-width="2" />
      <polygon points="-8,-24 0,-18 8,-24 4,-30 -4,-30" fill="#15803d" />
    </g>
    <g transform="translate(530, 180)">
      <circle cx="0" cy="0" r="26" fill="#ea580c" stroke="#c2410c" stroke-width="2" />
      <polygon points="-8,-26 0,-20 8,-26 4,-32 -4,-32" fill="#15803d" />
    </g>
    <g transform="translate(680, 160)">
      <circle cx="0" cy="0" r="22" fill="#f97316" stroke="#c2410c" stroke-width="2" />
      <polygon points="-8,-22 0,-16 8,-22 4,-28 -4,-28" fill="#15803d" />
    </g>
  </g>

  <!-- Mặt đất cỏ mùa thu -->
  <path d="M0,380 Q300,340 600,390 T800,370 L800,500 L0,500 Z" fill="#84cc16" />
  <path d="M0,420 Q250,380 550,430 T800,410 L800,500 L0,500 Z" fill="#65a30d" />

  <!-- CUA MẸ & CUA CON VỚI CHIẾC CÀNG ĐỎ THẮM (蟹の親子) -->
  <g transform="translate(240, 360)" filter="url(#softShadow)">
    <!-- Mai cua đỏ cam tròn trịa -->
    <ellipse cx="0" cy="20" rx="55" ry="40" fill="#ef4444" stroke="#b91c1c" stroke-width="3" />
    <!-- Hai mắt cua nhỏ ngộ nghĩnh thò lên -->
    <line x1="-16" y1="-8" x2="-16" y2="4" stroke="#b91c1c" stroke-width="4" stroke-linecap="round" />
    <circle cx="-16" cy="-10" r="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2" />
    <circle cx="-16" cy="-10" r="3" fill="#1e293b" />
    <line x1="16" y1="-8" x2="16" y2="4" stroke="#b91c1c" stroke-width="4" stroke-linecap="round" />
    <circle cx="16" cy="-10" r="6" fill="#ffffff" stroke="#b91c1c" stroke-width="2" />
    <circle cx="16" cy="-10" r="3" fill="#1e293b" />

    <!-- Đôi càng to lớn dũng cảm -->
    <path d="M-45,10 C-80,-10 -90,30 -65,40" stroke="#dc2626" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Càng kẹp trái -->
    <path d="M-85,-2 C-105,-20 -75,-25 -70,-8 Z" fill="#b91c1c" />
    <path d="M-85,-2 C-105,10 -75,20 -70,-2 Z" fill="#b91c1c" />

    <path d="M45,10 C80,-10 90,30 65,40" stroke="#dc2626" stroke-width="12" stroke-linecap="round" fill="none" />
    <!-- Càng kẹp phải giơ cao quả hồng -->
    <path d="M85,-2 C105,-20 75,-25 70,-8 Z" fill="#b91c1c" />
    <path d="M85,-2 C105,10 75,20 70,-2 Z" fill="#b91c1c" />

    <!-- 6 chân bò -->
    ${[ -40, -25, -10, 10, 25, 40 ].map(x => `<line x1="${x}" y1="50" x2="${x * 1.3}" y2="72" stroke="#b91c1c" stroke-width="4" stroke-linecap="round" />`).join('')}

    <!-- Nụ cười hiền lành của cua -->
    <path d="M-12,30 Q0,40 12,30" stroke="#7f1d1d" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- BẠN ĐỒNG HÀNH: HẠT DẺ (栗) & CỐI ĐÁ (臼) & CHÚ ONG (蜂) -->
  <g transform="translate(110, 390)" filter="url(#softShadow)">
    <!-- Hạt dẻ gai nhọn dũng mãnh -->
    <path d="M0,-25 C-25,-5 -25,25 0,30 C25,25 25,-5 0,-25 Z" fill="#78350f" stroke="#451a03" stroke-width="2" />
    <ellipse cx="0" cy="20" rx="18" ry="8" fill="#d97706" />
    <!-- Mắt hạt dẻ cương nghị -->
    <circle cx="-6" cy="2" r="2.5" fill="#ffffff" />
    <circle cx="-6" cy="2" r="1.2" fill="#1e293b" />
    <circle cx="6" cy="2" r="2.5" fill="#ffffff" />
    <circle cx="6" cy="2" r="1.2" fill="#1e293b" />
  </g>

  <!-- Chú ong bay vù vù -->
  <g transform="translate(190, 260)">
    <ellipse cx="0" cy="0" rx="14" ry="10" fill="#facc15" stroke="#713f12" stroke-width="1.5" />
    <line x1="-4" y1="-8" x2="-4" y2="8" stroke="#1c1917" stroke-width="3" />
    <line x1="4" y1="-8" x2="4" y2="8" stroke="#1c1917" stroke-width="3" />
    <ellipse cx="-4" cy="-12" rx="8" ry="4" fill="#ffffff" opacity="0.8" transform="rotate(-20, -4, -12)" />
    <ellipse cx="4" cy="-12" rx="8" ry="4" fill="#ffffff" opacity="0.8" transform="rotate(20, 4, -12)" />
  </g>

  <!-- Banner Tiêu Đề -->
  <g transform="translate(40, 40)" filter="url(#softShadow)">
    <rect x="0" y="0" width="310" height="46" rx="23" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
    <circle cx="24" cy="23" r="16" fill="#ea580c" />
    <text x="24" y="29" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle">蟹</text>
    <text x="52" y="22" font-family="'Noto Sans JP', sans-serif" font-weight="800" font-size="15" fill="#ffffff">第10章: 猿蟹合戦</text>
    <text x="52" y="37" font-family="'Noto Sans JP', sans-serif" font-weight="600" font-size="11" fill="#94a3b8">Sarukani Gassen - Cuộc Chiến Khỉ Và Cua</text>
  </g>
</svg>
