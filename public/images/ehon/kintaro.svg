<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#70d6ff" />
      <stop offset="60%" stop-color="#c0fdff" />
      <stop offset="100%" stop-color="#ebf4f6" />
    </linearGradient>
    <linearGradient id="mountainBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a7c59" />
      <stop offset="100%" stop-color="#2a4736" />
    </linearGradient>
    <linearGradient id="mountainMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#588157" />
      <stop offset="100%" stop-color="#344e41" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a3b18a" />
      <stop offset="100%" stop-color="#588157" />
    </linearGradient>
    <linearGradient id="bearBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3d261d" />
      <stop offset="100%" stop-color="#1f130e" />
    </linearGradient>
    <linearGradient id="axeBlade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Bầu trời xanh Ashigara -->
  <rect width="800" height="500" fill="url(#skyGrad)" />

  <!-- Mặt trời rực rỡ buổi sáng -->
  <g transform="translate(680, 90)">
    <circle cx="0" cy="0" r="48" fill="#ffb703" opacity="0.3" />
    <circle cx="0" cy="0" r="38" fill="#fb8500" />
    <circle cx="0" cy="0" r="30" fill="#ffb703" />
  </g>

  <!-- Mây trắng bồng bềnh -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="140" cy="80" rx="60" ry="24" />
    <ellipse cx="180" cy="70" rx="45" ry="28" />
    <ellipse cx="105" cy="88" rx="35" ry="18" />

    <ellipse cx="520" cy="95" rx="70" ry="26" />
    <ellipse cx="560" cy="85" rx="50" ry="30" />
  </g>

  <!-- Dãy núi Ashigara xa xa -->
  <path d="M-50,320 Q120,180 320,240 T720,190 L850,260 L850,500 L-50,500 Z" fill="url(#mountainBack)" opacity="0.75" />
  <path d="M-20,340 Q220,220 480,290 T850,250 L850,500 L-20,500 Z" fill="url(#mountainMid)" opacity="0.9" />

  <!-- Rừng thông tuyết tùng (Sugi & Matsu) -->
  <g fill="#1b4332">
    <!-- Cụm cây bên trái -->
    <polygon points="50,340 25,390 75,390" />
    <polygon points="50,320 30,360 70,360" />
    <polygon points="50,300 35,335 65,335" />
    <rect x="46" y="390" width="8" height="25" fill="#3e2723" />

    <polygon points="100,330 70,385 130,385" />
    <polygon points="100,305 76,350 124,350" />
    <polygon points="100,280 82,320 118,320" />
    <rect x="96" y="385" width="8" height="30" fill="#3e2723" />

    <!-- Cụm cây bên phải -->
    <polygon points="730,340 705,390 755,390" />
    <polygon points="730,320 710,360 750,360" />
    <polygon points="730,300 715,335 745,335" />
    <rect x="726" y="390" width="8" height="25" fill="#3e2723" />
  </g>

  <!-- Đồi cỏ xanh tiền cảnh -->
  <path d="M-20,380 Q200,330 460,370 T850,340 L850,500 L-20,500 Z" fill="url(#grassGrad)" />
  <path d="M-20,420 Q300,370 580,430 T850,400 L850,500 L-20,500 Z" fill="#386641" />

  <!-- Dòng suối nhỏ trong vắt uốn lượn -->
  <path d="M0,480 Q260,430 420,470 T820,460 L820,500 L0,500 Z" fill="#00b4d8" opacity="0.7" />

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- NHÂN VẬT 1: CHÚ GẤU ĐEN THÂN THIỆN (TSUKINOWAGUMA) BÊN PHẢI -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <g transform="translate(480, 240)" filter="url(#softShadow)">
    <!-- Thân gấu khổng lồ tròn trịa khỏe khoắn -->
    <ellipse cx="60" cy="120" rx="90" ry="85" fill="url(#bearBody)" />
    
    <!-- Chân gấu sau -->
    <ellipse cx="-10" cy="180" rx="35" ry="25" fill="#1f130e" />
    <ellipse cx="130" cy="180" rx="35" ry="25" fill="#1f130e" />

    <!-- Ngực vệt trăng khuyết trắng đặc trưng của gấu Nhật (Tsukinowaguma) -->
    <path d="M20,95 Q60,135 100,95 Q60,115 20,95 Z" fill="#f8fafc" opacity="0.95" />

    <!-- Cánh tay gấu ôm hông chào bạn -->
    <ellipse cx="-15" cy="120" rx="25" ry="40" transform="rotate(-20, -15, 120)" fill="url(#bearBody)" />
    <ellipse cx="135" cy="120" rx="25" ry="40" transform="rotate(20, 135, 120)" fill="url(#bearBody)" />

    <!-- Đầu gấu -->
    <circle cx="60" cy="45" r="52" fill="url(#bearBody)" />

    <!-- Tai gấu tròn xinh -->
    <circle cx="20" cy="5" r="16" fill="url(#bearBody)" />
    <circle cx="20" cy="5" r="9" fill="#78350f" />
    <circle cx="100" cy="5" r="16" fill="url(#bearBody)" />
    <circle cx="100" cy="5" r="9" fill="#78350f" />

    <!-- Mõm gấu màu sáng -->
    <ellipse cx="60" cy="55" rx="26" ry="20" fill="#d4a373" />
    <!-- Mũi gấu -->
    <path d="M50,45 Q60,40 70,45 Q60,54 50,45 Z" fill="#1f130e" />
    <!-- Nụ cười hiền lành -->
    <path d="M52,58 Q60,66 68,58" stroke="#1f130e" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Đôi mắt gấu vui tươi -->
    <ellipse cx="42" cy="38" rx="6" ry="8" fill="#1f130e" />
    <circle cx="44" cy="35" r="2.5" fill="#ffffff" />
    <ellipse cx="78" cy="38" rx="6" ry="8" fill="#1f130e" />
    <circle cx="80" cy="35" r="2.5" fill="#ffffff" />

    <!-- Má hồng chú gấu -->
    <circle cx="28" cy="52" r="8" fill="#f43f5e" opacity="0.4" />
    <circle cx="92" cy="52" r="8" fill="#f43f5e" opacity="0.4" />
  </g>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- NHÂN VẬT 2: CẬU BÉ KINTARŌ (KIM THÁI LANG) VỚI YẾM ĐỎ CHỮ KIM -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <g transform="translate(230, 210)" filter="url(#softShadow)">
    <!-- Rìu chiến khổng lồ (Masakari) đeo sau lưng -->
    <g transform="translate(70, -30) rotate(25)">
      <!-- Cán rìu gỗ chắc nịch -->
      <rect x="-8" y="0" width="16" height="240" rx="6" fill="#8d5b4c" stroke="#5c3a21" stroke-width="2" />
      <line x1="0" y1="20" x2="0" y2="230" stroke="#b08968" stroke-width="2" />
      <!-- Lưỡi rìu thép bán nguyệt khổng lồ sáng loáng -->
      <path d="M-8,15 C-45,-10 -65,30 -75,65 C-65,100 -40,135 -8,110 Z" fill="url(#axeBlade)" stroke="#334155" stroke-width="3" />
      <!-- Nẹp vàng giữ lưỡi rìu -->
      <rect x="-12" y="30" width="24" height="60" rx="3" fill="#eab308" stroke="#a16207" stroke-width="2" />
    </g>

    <!-- Thân thể cậu bé cường tráng, làn da hồng hào khỏe khoắn -->
    <!-- Chân Kintaro đứng thế vững chãi -->
    <ellipse cx="-20" cy="200" rx="20" ry="16" fill="#fbc4ab" stroke="#dd9b7f" stroke-width="2" />
    <ellipse cx="50" cy="200" rx="20" ry="16" fill="#fbc4ab" stroke="#dd9b7f" stroke-width="2" />

    <!-- Thân người hồng hào -->
    <rect x="-25" y="80" width="80" height="110" rx="30" fill="#fbc4ab" />

    <!-- Bắp tay lực lưỡng khoanh trước ngực / chống hông -->
    <ellipse cx="-35" cy="110" rx="18" ry="32" transform="rotate(20, -35, 110)" fill="#fbc4ab" stroke="#dd9b7f" stroke-width="2" />
    <ellipse cx="65" cy="110" rx="18" ry="32" transform="rotate(-20, 65, 110)" fill="#fbc4ab" stroke="#dd9b7f" stroke-width="2" />

    <!-- YẾM ĐỎ TRUYỀN THỐNG CỦA KINTARO (前掛け / Haragake) -->
    <polygon points="15,75 -35,185 65,185" fill="#dc2626" stroke="#991b1b" stroke-width="3" />
    <!-- Viền vàng tinh tế -->
    <polygon points="15,85 -25,178 55,178" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="6,4" />
    <!-- Dây yếm quàng qua cổ -->
    <path d="M-5,75 Q15,50 35,75" stroke="#ffffff" stroke-width="4" fill="none" />

    <!-- Chữ "金" (Kim) màu vàng rực rỡ nổi bật chính giữa yếm -->
    <g transform="translate(15, 142) scale(0.95)">
      <circle cx="0" cy="-6" r="28" fill="#fef08a" opacity="0.25" />
      <!-- Chữ 金 lối thư pháp đậm nét -->
      <text x="0" y="5" font-family="'Noto Sans JP', 'Hiragino Kaku Gothic Pro', 'MS Gothic', sans-serif" font-weight="900" font-size="34" fill="#fef08a" stroke="#b45309" stroke-width="2" text-anchor="middle" paint-order="stroke">
        金
      </text>
    </g>

    <!-- Đầu & Khuôn mặt hào sảng, thông minh -->
    <circle cx="15" cy="40" r="42" fill="#fbc4ab" stroke="#dd9b7f" stroke-width="2" />

    <!-- Kiểu tóc Okappa truyền thống của bé trai cổ trang Nhật -->
    <path d="M-28,35 C-32,-10 62,-10 58,35 C52,15 40,8 15,8 C-10,8 -22,15 -28,35 Z" fill="#18181b" />
    <!-- Mái tóc bằng dày dặn -->
    <path d="M-26,26 Q15,16 56,26 L56,10 Q15,-6 -26,10 Z" fill="#18181b" />

    <!-- Lông mày rậm anh hùng -->
    <path d="M-8,22 Q-1,18 7,23" stroke="#18181b" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M23,23 Q31,18 38,22" stroke="#18181b" stroke-width="4" stroke-linecap="round" fill="none" />

    <!-- Đôi mắt to tròn sáng ngời khí phách -->
    <circle cx="0" cy="34" r="6" fill="#18181b" />
    <circle cx="2" cy="32" r="2.5" fill="#ffffff" />
    <circle cx="30" cy="34" r="6" fill="#18181b" />
    <circle cx="32" cy="32" r="2.5" fill="#ffffff" />

    <!-- Má ửng hồng tinh nghịch -->
    <circle cx="-12" cy="45" r="9" fill="#ef4444" opacity="0.45" />
    <circle cx="42" cy="45" r="9" fill="#ef4444" opacity="0.45" />

    <!-- Nụ cười tự tin rạng rỡ -->
    <path d="M3,48 Q15,62 27,48 Z" fill="#b91c1c" />
    <path d="M6,49 Q15,54 24,49" fill="#ffffff" />
  </g>

  <!-- ════════════════════════════════════════════════════════════════ -->
  <!-- NHÂN VẬT PHỤ: CHÚ THỎ TRẮNG NÚI RỪNG REO HÒ BÊN DƯỚI -->
  <!-- ════════════════════════════════════════════════════════════════ -->
  <g transform="translate(130, 370)">
    <!-- Thân thỏ -->
    <ellipse cx="20" cy="30" rx="18" ry="15" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Đầu thỏ -->
    <circle cx="12" cy="15" r="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Đôi tai dài -->
    <ellipse cx="6" cy="-4" rx="4" ry="14" transform="rotate(-15, 6, -4)" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <ellipse cx="6" cy="-4" rx="2" ry="9" transform="rotate(-15, 6, -4)" fill="#fbcfe8" />
    <ellipse cx="16" cy="-6" rx="4" ry="14" transform="rotate(10, 16, -6)" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <ellipse cx="16" cy="-6" rx="2" ry="9" transform="rotate(10, 16, -6)" fill="#fbcfe8" />
    <!-- Mắt & mũi hồng -->
    <circle cx="8" cy="13" r="2" fill="#e11d48" />
    <polygon points="12,18 10,16 14,16" fill="#fb7185" />
  </g>

  <!-- Khóm hoa dại mùa xuân rực rỡ chân đồi -->
  <g transform="translate(370, 420)">
    <circle cx="0" cy="0" r="7" fill="#f43f5e" />
    <circle cx="0" cy="0" r="3" fill="#fef08a" />
    <circle cx="20" cy="8" r="6" fill="#3b82f6" />
    <circle cx="20" cy="8" r="2.5" fill="#ffffff" />
    <circle cx="38" cy="-2" r="8" fill="#eab308" />
    <circle cx="38" cy="-2" r="3.5" fill="#f97316" />
  </g>

  <!-- BANNER HUY HIỆU TÁC PHẨM CHUẨN ĐỒ HỌA CAO CẤP -->
  <g transform="translate(40, 40)" filter="url(#softShadow)">
    <rect x="0" y="0" width="310" height="46" rx="23" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
    <circle cx="24" cy="23" r="16" fill="#dc2626" />
    <text x="24" y="29" font-family="'Noto Sans JP', sans-serif" font-weight="900" font-size="16" fill="#fef08a" text-anchor="middle">金</text>
    <text x="52" y="22" font-family="'Noto Sans JP', sans-serif" font-weight="800" font-size="15" fill="#ffffff">第3章: 金太郎</text>
    <text x="52" y="37" font-family="'Noto Sans JP', sans-serif" font-weight="600" font-size="11" fill="#94a3b8">Kintarō - Cậu Bé Sức Mạnh Núi Ashigara</text>
  </g>
</svg>
